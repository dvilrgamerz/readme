name: MetroForge pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check src/game.js
      - name: Run simulation and accessibility tests
        run: npm test
      - name: Verify city builder page
        run: |
          test -s index.html
          test -s styles.css
          grep -q 'id="main-content"' index.html
